name: Publish to PyPI

# Publishes geochat-kernel and geochat-sdk to PyPI using Trusted Publishing
# (OIDC) - no API token is stored in this repository.
#
# One-time setup on pypi.org (per project, done by the repository owner):
#   PyPI -> Your projects -> Publishing (or, for a project that does not
#   exist on PyPI yet, "Add a pending publisher" under Account settings ->
#   Publishing), with:
#     Owner:            arazshah
#     Repository:       geochat-platform
#     Workflow name:    publish.yml
#     Environment name: pypi
#
# Publishing order matters, and it runs KERNEL FIRST: geochat_sdk imports
# geochat_kernel at module level (decorators.py, plugin.py, types/*.py),
# while geochat_kernel contains no reference to geochat_sdk at all. So the
# sdk depends on the kernel, not the other way round.
#
# To release: push a tag like v1.0.0, or run this workflow manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build geochat-kernel
        run: python -m build --outdir dist-kernel geochat-kernel

      - name: Build geochat-sdk
        run: python -m build --outdir dist-sdk geochat-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: dist-kernel
          path: dist-kernel/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdk
          path: dist-sdk/

  publish-kernel:
    name: Publish geochat-kernel
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-kernel
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-sdk:
    name: Publish geochat-sdk
    # Depends on publish-kernel, not just build: geochat-sdk imports
    # geochat_kernel at module level, so the kernel has to be on PyPI
    # first for the sdk to be installable.
    needs: publish-kernel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdk
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
